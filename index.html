<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VoiceAgent</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #222222;
      --accent: #e8ff47;
      --accent2: #47ffe8;
      --text: #f0f0f0;
      --muted: #555;
      --user-bubble: #1a1a1a;
      --bot-bubble: #141414;
      --red: #ff4747;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .logo span { color: var(--accent); }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* chat area */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 72%;
      animation: slideIn 0.25s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.bot  { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 12px 16px;
      border-radius: 2px;
      font-size: 0.92rem;
      line-height: 1.6;
      font-family: 'Space Mono', monospace;
    }
    .user .bubble {
      background: var(--user-bubble);
      border: 1px solid var(--accent);
      color: var(--accent);
    }
    .bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .label {
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
      font-family: 'Space Mono', monospace;
    }

    /* audio player inside bot bubble */
    .bot audio {
      margin-top: 10px;
      width: 100%;
      height: 32px;
      filter: invert(1) hue-rotate(180deg);
      opacity: 0.85;
    }

    /* thinking indicator */
    .thinking .bubble {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 14px 18px;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent2);
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    /* bottom bar */
    footer {
      border-top: 1px solid var(--border);
      padding: 20px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      background: var(--surface);
    }

    #record-btn {
      width: 52px; height: 52px;
      border-radius: 2px;
      border: 1px solid var(--accent);
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.1s;
      flex-shrink: 0;
    }
    #record-btn:hover { background: rgba(232,255,71,0.08); }
    #record-btn.recording {
      background: var(--red);
      border-color: var(--red);
      animation: recordPulse 1s infinite;
    }
    @keyframes recordPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,71,71,0.4); }
      50% { box-shadow: 0 0 0 8px rgba(255,71,71,0); }
    }
    #record-btn svg { pointer-events: none; }

    .footer-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    #status-text {
      font-size: 0.78rem;
      font-family: 'Space Mono', monospace;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
    #status-text.active { color: var(--accent); }
    #status-text.error { color: var(--red); }

    .hint {
      font-size: 0.65rem;
      color: #333;
      font-family: 'Space Mono', monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* waveform viz */
    #waveform {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 28px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #waveform.visible { opacity: 1; }
    .bar {
      width: 3px;
      background: var(--accent);
      border-radius: 1px;
      height: 4px;
      transition: height 0.1s;
    }

    /* empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      text-align: center;
      padding: 40px;
    }
    .empty-state .big { font-size: 2.5rem; opacity: 0.15; }
    .empty-state p { font-size: 0.78rem; font-family: 'Space Mono', monospace; letter-spacing: 0.08em; line-height: 1.8; }
  </style>
</head>
<body>

<header>
  <div class="logo">Voice<span>Agent</span></div>
  <div style="display:flex;align-items:center;gap:8px;">
    <span style="font-size:0.7rem;font-family:'Space Mono',monospace;color:var(--muted);letter-spacing:0.1em;">LLAMA 3.2</span>
    <div class="status-dot"></div>
  </div>
</header>

<div id="chat">
  <div class="empty-state" id="empty">
    <div class="big">🎙</div>
    <p>Press the button below<br/>and start speaking.</p>
  </div>
</div>

<footer>
  <button id="record-btn" title="Hold to record">
    <svg id="mic-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e8ff47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="2" width="6" height="12" rx="3"/>
      <path d="M5 10a7 7 0 0 0 14 0"/>
      <line x1="12" y1="19" x2="12" y2="22"/>
      <line x1="8" y1="22" x2="16" y2="22"/>
    </svg>
    <svg id="stop-icon" width="22" height="22" viewBox="0 0 24 24" fill="#fff" style="display:none">
      <rect x="4" y="4" width="16" height="16" rx="2"/>
    </svg>
  </button>

  <div class="footer-info">
    <span id="status-text">Ready — press to speak</span>
    <div id="waveform">
      ${Array(12).fill(0).map(() => `<div class="bar"></div>`).join('')}
    </div>
  </div>
</footer>

<script>
  const API_URL = "http://localhost:8000/chat";

  const recordBtn = document.getElementById("record-btn");
  const micIcon = document.getElementById("mic-icon");
  const stopIcon = document.getElementById("stop-icon");
  const statusText = document.getElementById("status-text");
  const chatEl = document.getElementById("chat");
  const emptyState = document.getElementById("empty");
  const waveform = document.getElementById("waveform");
  const bars = waveform.querySelectorAll(".bar");

  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;
  let animFrame = null;
  let analyser = null;

  function setStatus(text, type = "") {
    statusText.textContent = text;
    statusText.className = type;
  }

  function addMessage(role, content, audioUrl = null) {
    emptyState.style.display = "none";
    const msg = document.createElement("div");
    msg.className = `message ${role}`;

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = role === "user" ? "You" : "Agent";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = content;

    if (audioUrl) {
      const audio = document.createElement("audio");
      audio.controls = true;
      audio.src = audioUrl;
      audio.autoplay = true;
      bubble.appendChild(audio);
    }

    msg.appendChild(label);
    msg.appendChild(bubble);
    chatEl.appendChild(msg);
    chatEl.scrollTop = chatEl.scrollHeight;
    return msg;
  }

  function addThinking() {
    emptyState.style.display = "none";
    const msg = document.createElement("div");
    msg.className = "message bot thinking";
    const label = document.createElement("div");
    label.className = "label";
    label.textContent = "Agent";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = `<div class="dot"></div><div class="dot"></div><div class="dot"></div>`;
    msg.appendChild(label);
    msg.appendChild(bubble);
    chatEl.appendChild(msg);
    chatEl.scrollTop = chatEl.scrollHeight;
    return msg;
  }

  function animateBars(analyserNode) {
    const data = new Uint8Array(analyserNode.frequencyBinCount);
    function draw() {
      animFrame = requestAnimationFrame(draw);
      analyserNode.getByteFrequencyData(data);
      bars.forEach((bar, i) => {
        const val = data[i * 4] || 0;
        bar.style.height = `${4 + (val / 255) * 22}px`;
      });
    }
    draw();
  }

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

      // setup analyser for waveform
      const ctx = new AudioContext();
      const source = ctx.createMediaStreamSource(stream);
      analyser = ctx.createAnalyser();
      analyser.fftSize = 64;
      source.connect(analyser);

      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = () => handleAudio(stream);

      mediaRecorder.start();
      isRecording = true;

      recordBtn.classList.add("recording");
      micIcon.style.display = "none";
      stopIcon.style.display = "block";
      waveform.classList.add("visible");
      animateBars(analyser);
      setStatus("Recording... press to stop", "active");

    } catch (err) {
      setStatus("Microphone access denied", "error");
    }
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
      isRecording = false;
      cancelAnimationFrame(animFrame);
      waveform.classList.remove("visible");
      bars.forEach(b => b.style.height = "4px");
      recordBtn.classList.remove("recording");
      micIcon.style.display = "block";
      stopIcon.style.display = "none";
      setStatus("Processing...", "active");
    }
  }

  async function handleAudio(stream) {
    stream.getTracks().forEach(t => t.stop());

    const blob = new Blob(audioChunks, { type: "audio/wav" });
    const userUrl = URL.createObjectURL(blob);

    // show user message
    addMessage("user", "🎙 Voice message");

    const thinking = addThinking();

    try {
      const formData = new FormData();
      formData.append("audio", blob, "recording.wav");

      const res = await fetch(API_URL, {
        method: "POST",
        body: formData
      });

      thinking.remove();

      if (!res.ok) throw new Error(`Server error: ${res.status}`);

      const audioBlob = await res.blob();
      const audioUrl = URL.createObjectURL(audioBlob);

      addMessage("bot", "🔊 Voice response", audioUrl);
      setStatus("Ready — press to speak");

    } catch (err) {
      thinking.remove();
      addMessage("bot", `⚠ Error: ${err.message}`);
      setStatus("Error — try again", "error");
      setTimeout(() => setStatus("Ready — press to speak"), 3000);
    }
  }

  recordBtn.addEventListener("click", () => {
    if (!isRecording) startRecording();
    else stopRecording();
  });
</script>
</body>
</html>
